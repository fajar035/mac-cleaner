[project]
name = "maccleaner"
version = "0.1.0"
description = "CLI cleaner untuk macOS"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
macclean = "maccleaner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maccleaner*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM102",
    "SIM108",
    "BLE001",
    "S112",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"maccleaner/scanners/loginitems.py" = ["B904"]